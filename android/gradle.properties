org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The barcode model ships inside the APK rather than being downloaded on first
# use through Play Services.
#
# `false` is already mobile_scanner's default, which is why this line looks
# redundant. It is not: a driver scans their first parcel standing in an agency
# with no signal, and the unbundled variant would answer that scan by trying to
# fetch a model. Getting it right because a package default happens to agree
# with us is not a decision — and the default can change in a minor version
# without anything failing. `mobile_scanner_offline_test` asserts this line.
#
# Costs roughly 2.7 MB of APK. That is the price of a scanner that works in a
# stairwell.
dev.steenbakker.mobile_scanner.useUnbundled=false
