# Static analysis configuration for Delivery OS.
#
# CI runs `flutter analyze --fatal-infos`, so anything the analyzer reports —
# infos included — fails the build. Keep the tree clean rather than silencing
# rules with inline ignores.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # TODO markers are a deliberate signal in this repo (see the bundled geo
    # dataset in M0-22). They must not fail the build under --fatal-infos.
    todo: ignore
  # Generated sources. `flutter analyze --fatal-infos` runs with strict-casts,
  # and machine-written code does not satisfy it — the moment M0-14 runs
  # build_runner, thousands of lines of Drift and Riverpod output would fail the
  # build and the tempting fix would be to weaken the lints. Exclude the
  # generators' output instead, and keep the rules strict for hand-written code.
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/*.mocks.dart"
    - "**/generated_plugin_registrant.dart"
    - "lib/core/l10n/generated/**"
    # `drift_dev schema generate` output: a frozen snapshot of the schema at
    # each past version, regenerated by the tool and never edited by hand. It
    # does not follow the `.g.dart` naming convention, so it needs its own
    # entry. Excluding it is not a loosening — these files are compiled and
    # exercised by the migration harness, which is a stronger check than the
    # analyzer's.
    - "test/data/db/schema_versions/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - sort_pub_dependencies
    - test_types_in_equals
    - throw_in_finally
    # Invariant 5: every mutation runs inside a transaction. A dropped future
    # inside `db.transaction()` silently escapes it.
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_parenthesis
