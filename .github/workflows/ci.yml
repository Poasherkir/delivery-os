name: CI

# Runs on every push and every pull request. There is no release job here:
# signing and the Play track arrive in M5.
on:
  push:
  pull_request:

# A solo developer pushes often. Superseded runs are wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.4"
  # Matches the local development JDK. AGP 9 needs 17+, but keeping CI and the
  # dev machine on the same major version means CI failures are real failures,
  # not toolchain drift.
  JAVA_VERSION: "21"

jobs:
  verify:
    name: Format, analyze, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      # `dart format` does not read the analyzer's exclude list, so a bare
      # directory walk would gate on generated sources too. build_runner
      # formats its own output, but flutter gen-l10n is less predictable and
      # lands first (M0-05). Filter to hand-written files: the gate is not
      # weakened, it is aimed. A failure here is a file you wrote.
      - name: Check formatting
        run: |
          files=$(git ls-files '*.dart' \
            | grep -vE '\.(g|freezed|drift|mocks)\.dart$|/generated/' || true)
          if [ -z "$files" ]; then
            echo 'No hand-written Dart files to check.'
            exit 0
          fi
          echo "$files" | xargs dart format --set-exit-if-changed

      # --fatal-infos is deliberate. It is only tolerable because
      # analysis_options.yaml excludes generated sources; without those
      # exclusions the first build_runner output would force the lints to be
      # weakened, which is how lint debt starts.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      # The 90% bar for lib/domain/ was a rule with nothing enforcing it until
      # now — measured by hand once, at the M0 gate, and never again. 90 rather
      # than the 100 we currently sit at: a 100 gate turns every newly written
      # uncovered line into a red build, which produces pressure to write tests
      # that move a number rather than catch a defect.
      - name: Domain coverage
        run: dart run tool/check_domain_coverage.dart

      # Inert until the first release build, which is M5, and that is fine —
      # it needs to exist before that build, not before the first commit.
      #
      # The bundled geography is currently the three-wilaya FIXTURE. Shipping
      # it would give a driver an address picker containing three provinces and
      # four communes, with no error anywhere to say so. A unit test cannot
      # carry this check: asserting the version is not `fixture-` would fail
      # today, when the fixture is exactly what is bundled and correctly so.
      - name: Real geography dataset (release only)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        run: |
          version=$(python3 -c "import json;print(json.load(open('assets/geo/wilayas.json'))['version'])")
          echo "bundled geography version: $version"
          case "$version" in
            fixture-*)
              echo "::error::the fixture geography dataset cannot ship in a release build"
              exit 1
              ;;
          esac

      # No artifact upload. The build succeeding is the gate; a 146 MB fat
      # unshrunk debug APK is not something you would hand a field tester, and
      # it is cheaper to build locally. A release APK upload returns at M5,
      # when there are testers who need one.
      - name: Build debug APK
        run: flutter build apk --debug
