name: delivery_os
description: "Offline-first route, delivery and money management for Algerian delivery drivers."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# package:sqlite3 3.x bundles its own SQLite through Dart hooks — on every
# platform including the test host, so there is no separate plugin and no
# sqlite3.dll to find on Windows. sqlcipher_flutter_libs is obsolete and its
# 0.7.0 release is an empty package.
#
# The encryption-capable build is selected from the start so the binary never
# changes underneath us: M0-19 only adds `PRAGMA key`, it does not swap the
# engine. See ARCHITECTURE.md §13.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dependencies:
  drift: ^2.34.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  intl: ^0.20.2
  meta: ^1.18.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.31.0

flutter:
  uses-material-design: true

  # Runs gen-l10n against l10n.yaml on every build.
  generate: true

  assets:
    - assets/fonts/OFL.txt

  # IBM Plex Sans + IBM Plex Sans Arabic, bundled rather than fetched. This app
  # is offline-first: a runtime font download (google_fonts) would leave the AR
  # UI in a fallback face for any driver who first opens it without signal.
  #
  # Three weights only. Flutter synthesises missing weights as faux-bold, which
  # looks cheap — better to ship exactly what the type scale uses.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
