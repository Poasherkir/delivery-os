name: delivery_os
description: "Offline-first route, delivery and money management for Algerian delivery drivers."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# package:sqlite3 3.x bundles its own SQLite through Dart hooks — on every
# platform including the test host, so there is no separate plugin and no
# sqlite3.dll to find on Windows. sqlcipher_flutter_libs is obsolete and its
# 0.7.0 release is an empty package.
#
# The encryption-capable build is selected from the start so the binary never
# changes underneath us: M0-19 only adds `PRAGMA key`, it does not swap the
# engine. See ARCHITECTURE.md §13.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dependencies:
  # TEMPORARY PIN — remove it when the condition below clears. Not a judgement
  # about drift, and not a version this project wants to sit on.
  #
  # Why: drift 2.34.1+ moves GeneratedDatabase behind a drift3_preview path
  # that drift_dev 2.34.0's schema tooling cannot compile against, which breaks
  # `drift_dev schema dump` and with it the whole migration harness. The
  # drift_dev that matches (2.34.5) needs analyzer ^13. flutter_test pins
  # test_api 0.7.11, package:test resolves to 1.31, and that combination caps
  # analyzer at 12. So the real blocker is an analyzer skew in the test
  # toolchain, not anything in drift — drift is just where it surfaces.
  #
  # What releases it: flutter_test's test_api constraint moving far enough to
  # admit analyzer ^13. To check, drop both pins to ^2.34.0 and run
  #
  #     flutter pub get && dart run drift_dev schema dump \
  #       lib/data/db/app_database.dart drift_schema/
  #
  # If that resolves and the dump compiles, delete both pins and this comment.
  # Until then the migration harness is worth more than three patch versions.
  drift: 2.34.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  go_router: ^18.0.0
  intl: ^0.20.2
  meta: ^1.18.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  # TEMPORARY PIN — lifts together with the `drift` pin above, which carries
  # the reason and the release test. Both must name the same version: a caret
  # here lets `pub upgrade` move the generator alone onto a drift it cannot
  # compile against, and that surfaces as the schema tooling breaking rather
  # than as a version conflict.
  drift_dev: 2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.31.0

flutter:
  uses-material-design: true

  # Runs gen-l10n against l10n.yaml on every build.
  generate: true

  assets:
    - assets/fonts/OFL.txt

    # Algeria's wilayas and communes, bundled rather than fetched: this app
    # makes no network call before M4, and an address picker that needs signal
    # is an address picker that fails in a stairwell.
    #
    # These currently hold the three-wilaya FIXTURE, versioned `fixture-1`.
    # It is real data for three wilayas, not invented rows, and it is here so
    # the startup path can be exercised end to end on a device before the real
    # dataset exists. A CI step blocks any release build whose bundled version
    # still starts with `fixture-`.
    - assets/geo/wilayas.json
    - assets/geo/communes.json

  # IBM Plex Sans + IBM Plex Sans Arabic, bundled rather than fetched. This app
  # is offline-first: a runtime font download (google_fonts) would leave the AR
  # UI in a fallback face for any driver who first opens it without signal.
  #
  # Three weights only. Flutter synthesises missing weights as faux-bold, which
  # looks cheap — better to ship exactly what the type scale uses.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
